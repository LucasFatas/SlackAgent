display_information:
  name: Claude Agent
  description: Dispatches tasks to Claude Code routines from Slack threads
  background_color: "#4A154B"

features:
  bot_user:
    display_name: claude-agent
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - reactions:write

settings:
  event_subscriptions:
    # Replace with your Worker URL after deploying
    request_url: https://slack-agent.slack-agent-worker.workers.dev
    bot_events:
      - app_mention
      - message.channels
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
